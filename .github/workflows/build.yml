name: 打包APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: 下载中文语音模型
        run: |
          curl -L --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip
          unzip -q model.zip
          mkdir -p src/main/assets
          rm -rf src/main/assets/model-cn
          mv vosk-model-small-cn-0.22 src/main/assets/model-cn
          echo "cn-0.22-v1" > src/main/assets/model-cn/uuid
      - name: 准备固定签名
        run: base64 -d keystore.b64 > debug.keystore
      - run: gradle assembleDebug --no-daemon --stacktrace
      - run: mv build/outputs/apk/debug/*.apk tici.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 悬浮提词器 v${{ github.run_number }}
          files: tici.apk
